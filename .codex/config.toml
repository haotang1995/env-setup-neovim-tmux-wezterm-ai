sandbox_mode = "workspace-write"
approval_policy = "on-request"
model = "gpt-5.3-codex"
personality = "pragmatic"

[notice.model_migrations]
"gpt-5.2-codex" = "gpt-5.3-codex"
"gpt-5.3-codex" = "gpt-5.4"

# ── GitHub Copilot via the local proxy ────────────────────────────────────
# Definition only — inert until a profile selects it, so plain `codex` is
# unaffected. Activated by `codex-copilot`, which runs
# `codex <subcommand> --profile copilot` (see [profiles.copilot] below).
#
# `model_providers` cannot be set in project-level config; this file is
# user-level via the ~/.codex/config.toml symlink, so it belongs here.
#
# wire_api MUST be "responses" — Codex removed the chat/completions wire API in
# Feb 2026. Proxies that only serve /v1/chat/completions cannot drive Codex.
[model_providers.copilot_proxy]
name     = "GitHub Copilot (local proxy)"
base_url = "http://127.0.0.1:6868/v1"
env_key  = "COPILOT_PROXY_KEY"
wire_api = "responses"

# Profile selected by `codex --profile copilot` (what `codex-copilot` runs).
# DELIBERATELY NO `[profiles.copilot]` HERE, and codex-copilot does NOT use
# --profile. Codex changed the profile mechanism twice in one week:
#   0.116 — profiles must be `[profiles.<name>]` in THIS file; a --profile
#           placed before a subcommand is SILENTLY ignored (falls back to the
#           openai provider with no error).
#   0.147 — hard-errors on a legacy `[profiles.x]` table and demands a
#           standalone ~/.codex/<name>.config.toml instead.
# Codex auto-updates, so anything built on --profile breaks without warning.
# scripts/copilot-route.sh therefore selects the provider with `-c` overrides,
# which work identically on both versions and survive the next change.
# Verify routing from the startup banner: it must read `provider: copilot_proxy`.

[projects."/home/tanghao/env-setup-neovim-tmux-wezterm-ai"]
trust_level = "trusted"
